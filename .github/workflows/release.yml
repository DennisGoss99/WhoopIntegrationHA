name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify manifest version matches tag
        run: |
          MANIFEST=$(jq -r '.version' custom_components/whoop/manifest.json)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST" != "$TAG" ]; then
            echo "❌ manifest.json version ($MANIFEST) != tag ($TAG)"
            exit 1
          fi
          echo "✅ Version $MANIFEST matches tag"

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            custom_components/whoop/*.py
            custom_components/whoop/*.json
            custom_components/whoop/translations/*.json
